<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>极光</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#060a18}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var paused=false;window.__wmSetPaused=function(p){paused=p};
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
var W=function(){return innerWidth},H=function(){return innerHeight};
var stars=[],shoot=[],t0=performance.now();
for(var i=0;i<260;i++){stars.push({x:Math.random()*W(),y:Math.random()*H(),r:Math.random()*1.4+0.2,a:Math.random()*0.7+0.3})}
var bands=[];
var PAL=[[40,220,170],[80,170,255],[170,90,255],[255,90,190]];
for(var b=0;b<5;b++){bands.push({y:0.2+0.62*b/4,amp:60+40*Math.random(),spd:0.0003+0.0003*Math.random(),ph:Math.random()*6.28,cols:PAL[b%PAL.length]})}
function draw(){
  var w=W(),h=H(),t=(performance.now()-t0)/1000;
  var g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#05070f');g.addColorStop(0.6,'#0a0f24');g.addColorStop(1,'#0e1020');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(var i=0;i<stars.length;i++){var s=stars[i];ctx.globalAlpha=s.a*0.7;ctx.fillStyle='#dfe8ff';ctx.fillRect(s.x,s.y,s.r,s.r)}
  ctx.globalAlpha=1;
  ctx.save();
  ctx.filter='blur(18px)';
  ctx.globalCompositeOperation='lighter';
  for(var b=0;b<bands.length;b++){
    var ba=bands[b];
    ctx.beginPath();
    for(var x=0;x<=w;x+=24){
      var y=ba.y*h+Math.sin(x*0.004+ba.ph+t*ba.spd*400)*ba.amp+Math.sin(x*0.011-t*0.4)*ba.amp*0.4;
      if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.lineWidth=26+8*Math.sin(t*0.7+b);
    ctx.strokeStyle='rgba('+ba.cols[0]+','+ba.cols[1]+','+ba.cols[2]+',0.35)';
    ctx.stroke();
  }
  ctx.restore();
  if(Math.random()<0.01&&shoot.length<2){shoot.push({x:Math.random()*w,y:Math.random()*h*0.4,vx:6+Math.random()*5,vy:2+Math.random()*2,life:1})}
  for(var k=shoot.length-1;k>=0;k--){
    var s=shoot[k];s.x+=s.vx;s.y+=s.vy;s.life-=0.02;
    ctx.strokeStyle='rgba(220,235,255,'+s.life+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*6,s.y-s.vy*6);ctx.stroke();
    if(s.life<=0)shoot.splice(k,1);
  }
}
var last=0;
function loop(now){if(now-last>33){last=now;if(!paused)draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
